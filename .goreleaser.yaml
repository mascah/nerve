version: 2

project_name: nerve

before:
  hooks:
    - go mod tidy

builds:
  - id: nerve
    main: ./cmd/nerve
    binary: nerve
    env:
      - CGO_ENABLED=0
    # Pure Go, no cgo — cross-compiles cleanly to every target below. darwin/arm64
    # binaries are ad-hoc signed by the Go linker, and Homebrew strips the
    # quarantine xattr on install, so prebuilt CLI binaries run without a Developer
    # ID or notarization. Linux is included so the Homebrew tap formula installs a
    # prebuilt binary there too (no compile, no Go toolchain needed).
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mascah/nerve/internal/version.Version={{ .Version }}

archives:
  - id: nerve
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

# release-please owns the changelog and the GitHub Release.
#
# release-please maintains CHANGELOG.md from conventional commits and creates the
# GitHub Release (with notes drawn from that changelog) when its PR is merged.
# goreleaser runs afterwards purely to attach build artifacts, so:
#   - changelog generation is disabled here (no duplicate, divergent notes), and
#   - release.mode is keep-existing so goreleaser uploads onto the existing
#     release without overwriting release-please's notes.
# This is the single point that resolves the "two tools, one changelog" overlap.
changelog:
  disable: true

release:
  mode: keep-existing

# Homebrew is intentionally NOT generated here. goreleaser removed formula
# generation (`brews`) in v2.16 and only generates casks now — but a cask of an
# unsigned binary needs a quarantine-stripping hack and is macOS-only. We instead
# ship a prebuilt-binary *formula* (`brew install mascah/tap/nerve`, no `--cask`,
# no quarantine flag, works on macOS + Linux). goreleaser's job ends at building
# the binaries/archives above and uploading them to the release; the release
# workflow's `scripts/update-tap-formula.sh` step then writes Formula/nerve.rb in
# github.com/mascah/homebrew-tap from those archives' checksums and pushes it.
