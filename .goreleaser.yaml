version: 2

project_name: nerve

before:
  hooks:
    - go mod tidy

builds:
  - id: nerve
    main: ./cmd/nerve
    binary: nerve
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mascah/nerve/internal/version.Version={{ .Version }}

archives:
  - id: nerve
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

# release-please owns the changelog and the GitHub Release.
#
# release-please maintains CHANGELOG.md from conventional commits and creates the
# GitHub Release (with notes drawn from that changelog) when its PR is merged.
# goreleaser runs afterwards purely to attach build artifacts, so:
#   - changelog generation is disabled here (no duplicate, divergent notes), and
#   - release.mode is keep-existing so goreleaser uploads onto the existing
#     release without overwriting release-please's notes.
# This is the single point that resolves the "two tools, one changelog" overlap.
changelog:
  disable: true

release:
  mode: keep-existing

# Homebrew is intentionally NOT handled here. nerve ships via a hand-maintained
# build-from-source formula at github.com/mascah/homebrew-tap (Formula/nerve.rb):
# `brew install mascah/tap/nerve` compiles from source on the user's machine, so
# there's no code-signing, no Gatekeeper quarantine workaround, and Linux works
# too. Bump that formula's `url` tag + `sha256` on each release.
#
# Everything above is kept only for building downloadable release archives, which
# are optional and independent of the Homebrew path.
