name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pinned tool versions, shared across jobs. Bump together with the local install
# instructions in the Makefile / README.
env:
  GOLANGCI_LINT_VERSION: v2.12.2
  LEFTHOOK_VERSION: v1.13.6

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install the lint + hook tools, then run everything through lefthook so CI
      # and local checks share one definition. golangci-lint is invoked by the
      # pre-commit hook, not directly here.
      - name: Install tools (golangci-lint, lefthook)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          go install github.com/evilmartians/lefthook@${{ env.LEFTHOOK_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Run the SAME static checks developers run locally, so CI and local lint/
      # build can't drift. --all-files makes the staged-file-oriented hooks operate
      # on the whole tree (there are no staged files in a fresh CI checkout).
      - name: Static checks (gofmt, vet, golangci-lint, build)
        run: lefthook run pre-commit --all-files

      # Tests run here rather than in a git hook (fast commits; no test suite inside
      # git's hook environment).
      - name: Test (race detector)
        run: go test -race ./...
